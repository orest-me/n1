[package]
name = "n1-producer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "producer"
path = "src/main.rs"

[dependencies]
n1-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
